name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Our pushes and PRs run on the Mac runners; outsider PRs (bridged in by the `github` bot) never touch the Mac
    # and run on Linux.
    runs-on: ${{ (github.event_name != 'pull_request' || contains(fromJSON('["backmeupplz","renovate","claude"]'), github.event.pull_request.user.login)) && 'macos-latest' || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: JS syntax and manifest
        run: |
          for f in *.js; do node --check "$f" || exit 1; done
          node -e 'const m = JSON.parse(require("fs").readFileSync("manifest.json", "utf8")); if (m.manifest_version !== 3) throw new Error("not MV3")'
